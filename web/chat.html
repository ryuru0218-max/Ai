<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>POCHI CHAT — 友達と共有するAIチャット</title>
<meta name="description" content="POCHI ULTIMATE 専用のAIチャット。招待リンクを送れば友達と同じ部屋で会話できます。">
<style>
:root{--bg:#0a0c11;--bg2:#10131a;--panel:#151922;--panel2:#1b202b;--line:#252b39;
--fg:#e8ebf2;--mut:#8a92a6;--acc:#5b8cff;--acc2:#00d4a0;--err:#ff5c6c;--r:16px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:
 radial-gradient(900px 520px at 8% -10%,#1a2540 0%,transparent 58%),
 radial-gradient(760px 460px at 102% 0%,#0e2c28 0%,transparent 52%),
 var(--bg);color:var(--fg);
 font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif;
 overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.hide{display:none!important}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:60}
#boot .logo{width:60px;height:60px;border-radius:18px;background:linear-gradient(135deg,var(--acc),var(--acc2));
display:grid;place-items:center;font-weight:800;color:#08111f;font-size:26px;animation:bp 1.6s ease-in-out infinite}
@keyframes bp{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
#entry{position:fixed;inset:0;display:grid;place-items:center;padding:20px;overflow:auto;z-index:50}
.card{width:100%;max-width:440px;background:linear-gradient(180deg,var(--panel),var(--bg2));
border:1px solid var(--line);border-radius:20px;padding:30px 28px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.brand .logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--acc),var(--acc2));
display:grid;place-items:center;font-weight:800;color:#08111f;font-size:20px}
.brand h1{font-size:19px;letter-spacing:.2px}
.brand small{display:block;color:var(--mut);font-size:12px}
h2{font-size:21px;margin-bottom:6px}
p.lead{color:var(--mut);font-size:14px;margin-bottom:20px}
label{display:block;font-size:12px;color:var(--mut);margin:14px 0 6px;letter-spacing:.3px}
input[type=text]{width:100%;background:var(--panel2);border:1px solid var(--line);
border-radius:11px;padding:12px 14px;outline:none;transition:.15s}
input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(91,140,255,.16)}
.btn{width:100%;padding:13px 18px;border-radius:12px;font-weight:700;font-size:15px;
background:linear-gradient(135deg,var(--acc),#7aa2ff);color:#07101f;margin-top:16px}
.btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--fg)}
.btn.ghost:hover{border-color:var(--acc)}
.btn.sm{width:auto;padding:8px 14px;font-size:13.5px;margin-top:0}
.divider{display:flex;align-items:center;gap:12px;color:var(--mut);font-size:12px;margin:20px 0 4px}
.divider:before,.divider:after{content:"";flex:1;height:1px;background:var(--line)}
.hint{color:var(--mut);font-size:12.5px;margin-top:10px}
.err{color:var(--err);font-size:13px;margin-top:10px;min-height:18px}


/* ---------- チャット画面 ---------- */
#app{position:fixed;inset:0;display:none;grid-template-columns:264px 1fr;grid-template-rows:58px 1fr}
#top{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 16px;
background:rgba(13,16,22,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);z-index:5}
#top .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--acc),var(--acc2));
display:grid;place-items:center;font-weight:800;color:#08111f;font-size:15px}
#roomname{font-weight:700;font-size:15px}
#roommeta{color:var(--mut);font-size:11.5px}
#top .sp{flex:1}
.icon{width:36px;height:36px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);
display:grid;place-items:center;font-size:16px}
.icon:hover{border-color:var(--acc)}
#side{border-right:1px solid var(--line);background:rgba(13,16,22,.5);padding:14px;overflow:auto}
#side h3{font-size:11px;color:var(--mut);letter-spacing:1px;text-transform:uppercase;margin:6px 0 10px}
.invite{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:16px}
.invite code{display:block;background:var(--panel2);border-radius:8px;padding:9px;text-align:center;
font:600 15px/1.3 ui-monospace,Menlo,monospace;letter-spacing:2px;cursor:pointer}
.invite .url{font-size:11px;color:var(--mut);word-break:break-all;margin-top:8px}
.who{display:flex;align-items:center;gap:9px;padding:7px 4px;font-size:13.5px}
.dotu{width:9px;height:9px;border-radius:50%;background:var(--acc2)}
.dotu.off{background:#4a5163}
.setting{margin-bottom:12px}
.setting select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:9px;
padding:8px 10px;font-size:13px;outline:none}
.setting select:focus{border-color:var(--acc)}
#main{position:relative;overflow:hidden}
#log{position:absolute;inset:0;overflow-y:auto;padding:20px 18px 120px;scroll-behavior:smooth}
#loginner{max-width:860px;margin:0 auto}
.day{text-align:center;color:var(--mut);font-size:11.5px;margin:16px 0 10px}
.msg{display:flex;gap:11px;margin-bottom:16px;align-items:flex-start}
.msg .av{width:34px;height:34px;border-radius:11px;flex:0 0 auto;display:grid;place-items:center;
font-weight:700;font-size:13px;color:#08111f;background:linear-gradient(135deg,var(--acc),var(--acc2))}
.msg .bub{background:var(--panel);border:1px solid var(--line);border-radius:4px 15px 15px 15px;
padding:11px 15px;max-width:min(680px,78%);white-space:pre-wrap;word-break:break-word;line-height:1.65}
.msg.me{flex-direction:row-reverse}
.msg.me .bub{border-radius:15px 4px 15px 15px;background:linear-gradient(135deg,rgba(91,140,255,.22),rgba(0,212,160,.12));
border-color:rgba(91,140,255,.4)}
.msg .who2{font-size:12px;color:var(--mut);margin-bottom:3px}
.msg.ai .av{background:linear-gradient(135deg,#00d4a0,#5b8cff)}
.msg.sys{justify-content:center}
.msg.sys .bub{background:transparent;border:0;color:var(--mut);font-size:12.5px;text-align:center;max-width:100%}
.typing{display:inline-flex;gap:4px;align-items:center}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--mut);animation:tp 1.1s infinite}
.typing i:nth-child(2){animation-delay:.16s}.typing i:nth-child(3){animation-delay:.32s}
@keyframes tp{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
#composer{position:absolute;left:0;right:0;bottom:0;padding:12px 18px 18px;
background:linear-gradient(180deg,transparent,rgba(10,12,17,.92) 32%)}
#cbox{max-width:860px;margin:0 auto;display:flex;gap:10px;align-items:flex-end}
#text{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 15px;
outline:none;resize:none;max-height:160px;min-height:46px;line-height:1.55}
#text:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(91,140,255,.14)}
#send{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--acc),#7aa2ff);
color:#07101f;font-size:19px;display:grid;place-items:center;flex:0 0 auto}
#send:disabled{opacity:.45}
#share{position:absolute;inset:0;background:rgba(6,8,12,.72);display:none;place-items:center;z-index:20;
backdrop-filter:blur(6px);padding:20px}
#share.on{display:grid}
#share .card{max-width:520px}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--panel);
border:1px solid var(--line);border-left:3px solid var(--acc2);border-radius:12px;padding:11px 18px;
font-size:13.5px;opacity:0;transition:.25s;pointer-events:none;z-index:70;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:860px){
 #app{grid-template-columns:1fr}
 #side{position:absolute;left:0;top:58px;bottom:0;width:264px;z-index:8;background:#0d1016;
 transform:translateX(-100%);transition:.24s}
 #side.on{transform:none}
 .msg .bub{max-width:86%}
}
</style>
</head>
<body>
<div id="boot"><div class="logo">P</div></div>


<!-- ================= 入口 ================= -->
<div id="entry">
  <div class="card">
    <div class="brand">
      <div class="logo">P</div>
      <div><h1>POCHI CHAT</h1><small>友達と共有する AI チャット</small></div>
    </div>
    <div id="joinView">
      <h2>会話を始めよう</h2>
      <p class="lead">名前を入力して、新しい部屋を作るか、招待コードから友達の部屋に参加します。</p>
      <label>あなたの名前</label>
      <input type="text" id="myname" placeholder="例: Tester" maxlength="24" autocomplete="nickname">
      <label>招待コード（参加する場合のみ）</label>
      <input type="text" id="code" placeholder="例: A7K2P9" maxlength="12" autocomplete="off"
             style="text-transform:uppercase;letter-spacing:3px">
      <button class="btn" id="go">チャットを始める</button>
      <div class="divider">または</div>
      <button class="btn ghost" id="newroom">新しい部屋を作る（招待リンクを発行）</button>
      <div class="err" id="eerr"></div>
      <div class="hint">招待リンクを送ると、ブラウザ無しでも同じ会話を読めます。</div>
    </div>
  </div>
</div>

<!-- ================= チャット ================= -->
<div id="app">
  <div id="top">
    <div class="logo">P</div>
    <div><div id="roomname">—</div><div id="roommeta">—</div></div>
    <div class="sp"></div>
    <button class="icon" id="menu" title="サイドバー">☰</button>
    <button class="icon" id="shareBtn" title="共有">🔗</button>
  </div>

  <aside id="side">
    <h3>この部屋を共有</h3>
    <div class="invite">
      <code id="icode" title="クリックでコピー">------</code>
      <div class="url" id="iurl"></div>
      <button class="btn ghost sm" id="copy" style="width:100%;margin-top:9px">リンクをコピー</button>
    </div>
    <h3>参加者</h3>
    <div id="who"></div>
    <h3>AI 設定</h3>
    <div class="setting"><label>会話モード</label><select id="selMode"></select></div>
    <div class="setting"><label>人格</label><select id="selPersona"></select></div>
    <div class="setting"><label>応答スタイル</label><select id="selStyle"></select></div>
    <h3>会话</h3>
    <button class="btn ghost sm" id="export" style="width:100%">会話を書き出す</button>
    <button class="btn ghost sm" id="leave" style="width:100%;margin-top:8px">退出する</button>
  </aside>

  <div id="main">
    <div id="log"><div id="loginner"></div></div>
    <div id="composer">
      <div id="cbox">
        <textarea id="text" placeholder="メッセージを入力 (Enterで送信 / Shift+Enterで改行)" rows="1"></textarea>
        <button id="send" disabled>➤</button>
      </div>
    </div>
    <div id="share">
      <div class="card">
        <h2>この会話を共有</h2>
        <p class="lead">友達に下のリンクを送ると、同じ会話に参加できます。</p>
        <label>招待リンク</label>
        <input type="text" id="shareUrl" readonly>
        <label>招待コード</label>
        <input type="text" id="shareCode" readonly style="letter-spacing:3px">
        <button class="btn" id="copy2">リンクをコピー</button>
        <button class="btn ghost" id="closeShare">閉じる</button>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2400);};
const api=async(p,o={})=>{o.headers=Object.assign({'Content-Type':'application/json'},o.headers||{});
 const r=await fetch(p,o);let d=null;try{d=await r.json();}catch(e){}
 if(!r.ok) throw new Error((d&&(d.error||d.message))||('HTTP '+r.status)); return d;};
const KEY='pochi_chat_id', NAME='pochi_chat_name';
let S={room:null, me:null, mode:'normal_full', persona:'none', style:'normal', lastId:0, es:null, sending:false};
const colorOf=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return 'hsl('+(h%360)+',62%,58%)';};
const initials=s=>String(s||'?').trim().slice(0,2).toUpperCase();


/* ---------------- 描画 ---------------- */
function addMsg(m){
  const box=$('#loginner');
  const atBottom=($('#log').scrollHeight-$('#log').scrollTop-$('#log').clientHeight)<130;
  if(m.kind==='day'){const d=document.createElement('div');d.className='day';d.textContent=m.text;box.appendChild(d);return;}
  if(m.kind==='typing'){const t=document.getElementById('typing');if(t)t.remove();
    const d=document.createElement('div');d.className='msg ai';d.id='typing';
    d.innerHTML='<div class="av">P</div><div class="bub"><span class="typing"><i></i><i></i><i></i></span></div>';
    box.appendChild(d);return;}
  const d=document.createElement('div');
  d.className='msg'+(m.role==='user'?' me':'')+(m.role==='ai'?' ai':'');
  const av=m.role==='ai'?'P':initials(m.author);
  d.innerHTML='<div class="av" style="background:'+(m.role==='ai'?'linear-gradient(135deg,#00d4a0,#5b8cff)':colorOf(m.author))+'">'+esc(av)+'</div>'+
    '<div><div class="who2">'+esc(m.author)+'</div><div class="bub">'+esc(m.text)+'</div></div>';
  box.appendChild(d);
  if(atBottom)$('#log').scrollTop=$('#log').scrollHeight;
}
function setWho(list){
  $('#who').innerHTML=(list||[]).map(p=>
    '<div class="who"><i class="dotu'+(p.online?'':' off')+'"></i>'+esc(p.name)+
    (p.is_ai?' <span style="color:var(--acc2);font-size:11px">AI</span>':'')+'</div>').join('')||
    '<div style="color:var(--mut);font-size:12.5px">—</div>';
}
function fillSelect(sel,obj,cur){
  sel.innerHTML=Object.entries(obj).map(([k,v])=>'<option value="'+k+'"'+(k===cur?' selected':'')+'>'+esc(v)+'</option>').join('');
}

/* ---------------- 参加 / 作成 ---------------- */
async function enter(code,name){
  $('#eerr').textContent='';
  const body={name:name, code:(code||'').trim().toUpperCase()};
  let d;
  try{ d = await api('/api/chat/rooms',{method:'POST',body:JSON.stringify(body)}); }
  catch(e){ $('#eerr').textContent='参加できません: '+e.message; return false; }
  S.room=d.room; S.me=d.user; S.mode=d.room.mode||'normal_full';
  S.persona=d.room.persona||'none'; S.style=d.room.style||'normal'; S.lastId=0;
  localStorage.setItem(KEY,d.room.id); localStorage.setItem(NAME,name);
  history.replaceState(null,'','/room/'+d.room.code);
  showRoom(); await refresh(); connect();
  return true;
}
function showRoom(){
  $('#entry').classList.add('hide'); $('#app').style.display='grid';
  $('#roomname').textContent=S.room.name;
  $('#roommeta').textContent='招待コード '+S.room.code+' / '+S.room.members+'人';
  $('#icode').textContent=S.room.code;
  $('#iurl').textContent=S.room.url;
  $('#shareUrl').value=S.room.url; $('#shareCode').value=S.room.code;
}


/* ---------------- メッセージ取得 / ストリーム ---------------- */
async function refresh(){
  const d=await api('/api/chat/rooms/'+S.room.id+'/messages?after='+S.lastId);
  const box=$('#loginner');
  if(!S.lastId) box.innerHTML='';
  d.messages.forEach(m=>{ if(m.kind!=='typing') addMsg(m); });
  if(d.messages.length) S.lastId=d.messages[d.messages.length-1].id;
  S.room=d.room;
  $('#roommeta').textContent='招待コード '+S.room.code+' / '+S.room.members+'人';
  setWho(d.participants);
  fillSelect($('#selMode'),d.modes||{},S.mode); fillSelect($('#selPersona'),d.personas||{},S.persona);
  fillSelect($('#selStyle'),d.styles||{},S.style);
  const t=document.getElementById('typing'); if(t)t.remove();
}
function connect(){
  if(S.es) S.es.close();
  const es=new EventSource('/api/chat/stream/'+S.room.id+'?me='+encodeURIComponent(S.me));
  S.es=es;
  es.onmessage=async ev=>{
    try{
      const d=JSON.parse(ev.data);
      if(d.type==='message'){ await refresh(); }
      else if(d.type==='participants'){ setWho(d.participants); }
      else if(d.type==='typing'){ if(d.on) addMsg({kind:'typing'}); else{const t=document.getElementById('typing');if(t)t.remove();} }
    }catch(e){}
  };
  es.onerror=()=>{ es.close(); setTimeout(()=>{ if(S.room) connect(); },4000); };
}

/* ---------------- 送信 ---------------- */
async function send(){
  const ta=$('#text'); const text=ta.value.trim();
  if(!text||S.sending) return;
  S.sending=true; $('#send').disabled=true; ta.value=''; ta.style.height='46px';
  try{
    await api('/api/chat/rooms/'+S.room.id+'/messages',{method:'POST',
      body:JSON.stringify({text:text, author:S.me,
        mode:$('#selMode').value, persona:$('#selPersona').value, style:$('#selStyle').value})});
    await refresh();
  }catch(e){ toast('送信失敗: '+e.message); ta.value=text; }
  S.sending=false; $('#send').disabled=!ta.value.trim(); ta.focus();
}

/* ---------------- 初期化 ---------------- */
function fatal(msg){
  $('#boot').style.display='none';
  $('#entry').classList.remove('hide');
  const e=$('#eerr'); e.textContent=msg; e.style.color='var(--err)';
}
async function boot(){
 try{
  const cfg=await api('/api/chat/config');
  fillSelect($('#selMode'),cfg.modes||{},'normal_full');
  fillSelect($('#selPersona'),cfg.personas||{},'none');
  fillSelect($('#selStyle'),cfg.styles||{},'normal');
 }catch(e){ /* 設定取得に失敗しても部屋参加は試す */ }
 const rid=localStorage.getItem(KEY);
 const code=(location.pathname.match(/^\/room\/([A-Za-z0-9]+)/)||[])[1];
 const nm=localStorage.getItem(NAME)||'';
 $('#myname').value=nm; if(code)$('#code').value=code.toUpperCase();
 if(rid){
  try{
   const d=await api('/api/chat/rooms/'+rid);
   S.room=d.room; S.me=d.room.me||nm; S.mode=d.room.mode;
   S.persona=d.room.persona; S.style=d.room.style; S.lastId=0;
   showRoom(); await refresh(); connect();
   $('#boot').style.display='none'; return;
  }catch(e){ localStorage.removeItem(KEY); }
 }
 if(code){
  try{
   if(await enter(code, nm||'ゲスト')){ $('#boot').style.display='none'; return; }
  }catch(e){ fatal('部屋に参加できません: '+e.message); return; }
 }
 $('#boot').style.display='none';
}
window.addEventListener('error',e=>{ if($('#boot').style.display!=='none') fatal('読み込みエラー: '+(e.message||'不明')); });
window.addEventListener('unhandledrejection',e=>{ if($('#boot').style.display!=='none') fatal('読み込みエラー: '+((e.reason&&e.reason.message)||'不明')); });
$('#go').onclick=async()=>{const n=$('#myname').value.trim();
 if(!n){$('#eerr').textContent='名前を入力してください';$('#eerr').style.color='';return;}
 try{ if(await enter($('#code').value,n)) $('#boot').style.display='none'; }
 catch(e){ fatal('参加できません: '+e.message); }};
$('#newroom').onclick=async()=>{const n=$('#myname').value.trim();
 if(!n){$('#eerr').textContent='名前を入力してください';$('#eerr').style.color='';return;}
 try{ if(await enter('',n)) $('#boot').style.display='none'; }
 catch(e){ fatal('部屋を作成できません: '+e.message); }};
$('#send').onclick=send;
$('#text').addEventListener('input',e=>{e.target.style.height='auto';
 e.target.style.height=Math.min(160,e.target.scrollHeight)+'px';
 $('#send').disabled=!e.target.value.trim()||S.sending;});
$('#text').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
$('#code').addEventListener('keydown',e=>{if(e.key==='Enter')$('#go').click();});
$('#myname').addEventListener('keydown',e=>{if(e.key==='Enter'){if($('#code').value.trim())$('#go').click();else $('#newroom').click();}});
$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(S.room.url);toast('リンクをコピーしました');}catch(e){toast('コピー失敗: 手動でコピーしてください');}};
$('#copy2').onclick=async()=>{try{await navigator.clipboard.writeText($('#shareUrl').value);toast('リンクをコピーしました');}catch(e){toast('コピー失敗');}};
$('#icode').onclick=async()=>{try{await navigator.clipboard.writeText(S.room.code);toast('コードをコピーしました');}catch(e){}};
$('#shareBtn').onclick=()=>$('#share').classList.add('on');
$('#closeShare').onclick=()=>$('#share').classList.remove('on');
$('#menu').onclick=()=>$('#side').classList.toggle('on');
$('#leave').onclick=()=>{ if(confirm('この部屋から退出しますか？')){ localStorage.removeItem(KEY); location.href='/'; } };
